<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Blossom Wishes 🌸</title>
<style>
:root{--pink:#ff9fc9}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;display:grid;place-items:center;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 72%,#35365d 0%,#1c2342 42%,#0c1228 100%)}
.stars,.petal-fall{position:fixed;inset:0;pointer-events:none;overflow:hidden}.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff5d5;animation:twinkle 4s ease-in-out infinite alternate}@keyframes twinkle{from{opacity:.2}to{opacity:.85}}
.moon{position:fixed;top:7%;right:12%;width:62px;height:62px;border-radius:50%;background:#fff2cf;box-shadow:0 0 24px #ffe7a344}.moon:after{content:"";position:absolute;top:-5px;left:15px;width:58px;height:58px;border-radius:50%;background:#11172e}
.scene{width:min(1000px,100vw);height:min(760px,100vh);position:relative;display:flex;align-items:center;justify-content:center;animation:sceneIn 3.5s ease both}@keyframes sceneIn{from{opacity:0}to{opacity:1}}
.heading{position:absolute;top:4%;width:100%;text-align:center;z-index:2;padding:0 16px;opacity:0;animation:headingIn 2s 2s ease forwards}@keyframes headingIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
.eyebrow{color:#ffd9e9;letter-spacing:.12em;font-size:clamp(10px,2.5vw,13px);margin-bottom:8px}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(25px,5vw,43px);line-height:1.12;margin:0;color:#fff0f7;text-shadow:0 0 18px #ff9fc944}.hint{font-size:12px;color:#d6d7f3;margin-top:10px}
svg{width:100%;height:100%;overflow:visible}.trunk,.branch,.twig{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 5s cubic-bezier(.45,0,.2,1) forwards}.trunk{stroke:#53364e;stroke-width:23;animation-delay:.5s}.branch{stroke:#69445e;stroke-width:12;animation-delay:1.4s}.twig{stroke:#80516d;stroke-width:5;animation-delay:2.2s}@keyframes draw{to{stroke-dashoffset:0}}
.blossom{cursor:default;pointer-events:visiblePainted;transform-box:fill-box;transform-origin:center;opacity:0;animation:bloom 1.3s ease-out forwards;transition:filter .2s}.blossom:hover{filter:brightness(1.08)}@keyframes bloom{0%{opacity:0;scale:.45}75%{opacity:1;scale:1.04}100%{opacity:1;scale:1}}
.leaf{cursor:pointer;pointer-events:visiblePainted;opacity:0;animation:leafIn 1.4s ease-out forwards;transform-box:fill-box;transform-origin:center;transition:filter .2s}.leaf:hover{filter:brightness(1.08)}@keyframes leafIn{from{opacity:0}to{opacity:1}}.leaf-shape{fill:#6cae91;stroke:#b0e7bb;stroke-width:1.2}.leaf:nth-of-type(even) .leaf-shape{fill:#83c7a0}.petal{fill:var(--pink);stroke:#ffd5e7;stroke-width:1}.petal.light{fill:#ffd0e4}.petal.dark{fill:#ed78ad}.flower-center{fill:#ffe8a3}
.message{position:absolute;left:50%;top:51%;transform:translate(-50%,-45%) scale(.97);width:min(86%,430px);padding:23px 20px;border:1px solid #ffffff55;border-radius:22px;text-align:center;background:linear-gradient(145deg,#fff1f8f2,#f7cfe7ed);color:#68344f;box-shadow:0 12px 35px #070b2077;opacity:0;pointer-events:none;z-index:5;transition:opacity .35s ease,transform .35s ease;cursor:pointer}.message.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}.message .emoji{font-size:28px;display:block;margin-bottom:7px}.message h2{font-family:Georgia,serif;font-weight:400;font-size:clamp(25px,5vw,36px);line-height:1.15;margin:0 0 8px;color:#8f3f70}.message p{margin:0;font-size:14px;line-height:1.55;color:#794b68}.message button{margin-top:14px;border:1px solid #d58db5;color:#8f3f70;background:#fff8fc;padding:8px 15px;border-radius:999px;cursor:pointer;font:inherit;font-size:12px}.bottom-note{position:absolute;bottom:3%;text-align:center;width:100%;font-size:10px;color:#c4c9e7;letter-spacing:.08em}.falling{position:absolute;top:-25px;width:7px;height:11px;background:#ffc0dc;border-radius:90% 10% 80% 20%;opacity:.6;animation:fall linear infinite}@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.05}}
@media(max-width:600px){.moon{width:44px;height:44px;right:7%;top:10%}.moon:after{width:42px;height:42px;left:12px;top:-5px}.hint{font-size:11px}.bottom-note{bottom:1.5%}.message{top:53%;padding:20px 16px}svg{width:100%;height:100%}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style></head><body>
<div class="stars" id="stars"></div><div class="moon"></div><div class="petal-fall" id="petalFall"></div>
<main class="scene"><header class="heading"><div class="eyebrow">A little moment of magic for my sweetest friend</div><h1>A Sweetest Blossom Morning Wishes</h1><div class="hint">Tap a green leaf to reveal a little wish 🌸</div></header>
<svg viewBox="0 0 900 700" role="img" aria-label="Cherry blossom tree with four clickable leaves"><defs><radialGradient id="glow"><stop offset="0" stop-color="#ffafd8" stop-opacity=".2"/><stop offset="1" stop-color="#ffafd8" stop-opacity="0"/></radialGradient><linearGradient id="groundGlow" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#8c6a9b" stop-opacity=".18"/><stop offset="1" stop-color="#11172c" stop-opacity="0"/></linearGradient></defs>
<ellipse cx="450" cy="590" rx="360" ry="105" fill="url(#groundGlow)"/><ellipse cx="450" cy="595" rx="235" ry="24" fill="#090f24" opacity=".5"/><g opacity=".65"><circle cx="270" cy="190" r="150" fill="url(#glow)"/><circle cx="570" cy="210" r="180" fill="url(#glow)"/><circle cx="430" cy="120" r="170" fill="url(#glow)"/></g>
<path class="trunk" d="M445 592 C435 520 464 466 445 405 C430 354 389 325 360 286 C333 251 316 216 303 176"/><path class="branch" d="M446 468 C490 416 529 374 554 320 C573 279 592 236 631 203"/><path class="branch" d="M438 421 C386 395 334 365 298 322 C271 290 252 260 230 229"/><path class="branch" d="M450 365 C478 321 481 274 466 229 C454 194 448 166 456 128"/><path class="twig" d="M365 290 C385 250 397 216 390 178 M303 177 C280 153 266 135 260 112 M554 320 C522 281 515 248 524 211 M592 238 C626 232 653 217 672 188 M299 322 C263 326 230 313 205 289 M482 278 C514 259 542 241 558 210 M383 397 C354 414 332 435 320 462 M491 414 C530 432 556 450 573 480"/>
<!-- Exactly four clickable leaves -->
<g class="leaf" tabindex="0" role="button" aria-label="Good Morning Priya" data-message="morning" transform="translate(270 248) rotate(-38)" style="animation-delay:5.8s"><path class="leaf-shape" d="M0 0 C-25 -25 -53 -21 -61 -5 C-36 16 -14 15 0 0Z"/><path d="M-54 -5 Q-25 -2 0 0" fill="none" stroke="#d5f5d6" stroke-width="1.2"/></g>
<g class="leaf" tabindex="0" role="button" aria-label="Keep positive" data-message="positive" transform="translate(581 284) rotate(28)" style="animation-delay:6.3s"><path class="leaf-shape" d="M0 0 C24 -25 52 -21 61 -5 C37 16 15 15 0 0Z"/><path d="M54 -5 Q25 -2 0 0" fill="none" stroke="#d5f5d6" stroke-width="1.2"/></g>
<g class="leaf" tabindex="0" role="button" aria-label="Stay healthy" data-message="healthy" transform="translate(357 337) rotate(20)" style="animation-delay:6.8s"><path class="leaf-shape" d="M0 0 C-23 -24 -50 -20 -58 -5 C-35 15 -14 14 0 0Z"/><path d="M-52 -5 Q-25 -2 0 0" fill="none" stroke="#d5f5d6" stroke-width="1.2"/></g>
<g class="leaf" tabindex="0" role="button" aria-label="Enjoy your day with positivity" data-message="positivity" transform="translate(505 380) rotate(-20)" style="animation-delay:7.3s"><path class="leaf-shape" d="M0 0 C25 -25 52 -20 60 -5 C36 15 14 14 0 0Z"/><path d="M53 -5 Q25 -2 0 0" fill="none" stroke="#d5f5d6" stroke-width="1.2"/></g>
<g id="flowers"></g></svg>
<section class="message" id="message" aria-live="polite" aria-label="Wish message"><span class="emoji" id="messageEmoji">🌸</span><h2 id="messageTitle">Good Morning Priya</h2><p id="messageText"></p><button id="closeMessage">Back to the blossoms</button></section><div class="bottom-note">MADE WITH A LITTLE LOVE &amp; A LOT OF BLOSSOMS</div></main>
<script>
// Lightweight ambient effects: fewer DOM elements for smoother mobile performance.
const stars=document.getElementById('stars');for(let i=0;i<32;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*4+'s';stars.appendChild(s)}
const fall=document.getElementById('petalFall');for(let i=0;i<8;i++){const p=document.createElement('span');p.className='falling';p.style.left=Math.random()*100+'%';p.style.animationDelay=(-Math.random()*20)+'s';p.style.animationDuration=(18+Math.random()*12)+'s';fall.appendChild(p)}
const ns='http://www.w3.org/2000/svg',flowers=document.getElementById('flowers');const flowerPoints=[[303,176],[260,112],[390,178],[456,128],[524,211],[631,203],[672,188],[230,229],[205,289],[298,322],[360,286],[466,229],[558,210],[554,320],[592,238],[320,462],[573,480],[386,395],[530,374],[445,405],[335,250],[412,208],[488,174],[280,280],[605,260],[368,230],[510,300],[250,195],[430,155],[590,180],[325,365],[490,430]];const palette=['#ffafd2','#ffd0e4','#f58dbb','#ffe0ed'];
function makeFlower(x,y,i){const g=document.createElementNS(ns,'g');g.setAttribute('class','blossom');g.style.animationDelay=(4.8+i*.16)+'s';g.setAttribute('transform',`translate(${x} ${y}) scale(${.72+(i%4)*.1})`);const r=10+(i%3)*1.4;for(let j=0;j<5;j++){const a=j*72-90,rad=a*Math.PI/180,e=document.createElementNS(ns,'ellipse'),cx=Math.cos(rad)*r*.72,cy=Math.sin(rad)*r*.72;e.setAttribute('class','petal '+(j%3===0?'light':j%3===2?'dark':''));e.setAttribute('cx',cx);e.setAttribute('cy',cy);e.setAttribute('rx',r*.57);e.setAttribute('ry',r*.39);e.setAttribute('transform',`rotate(${a+90} ${cx} ${cy})`);e.setAttribute('fill',palette[(i+j)%palette.length]);g.appendChild(e)}const c=document.createElementNS(ns,'circle');c.setAttribute('class','flower-center');c.setAttribute('r',r*.24);g.appendChild(c);flowers.appendChild(g)}flowerPoints.forEach((p,i)=>makeFlower(p[0],p[1],i));
const message=document.getElementById('message'),title=document.getElementById('messageTitle'),body=document.getElementById('messageText'),emoji=document.getElementById('messageEmoji');let closeTimer;
const wishes={morning:{title:'Good Morning Priya',text:'Wishing you a beautiful morning filled with smiles and happiness. 🌸',emoji:'🌸'},positive:{title:'Keep positive',text:'Keep your thoughts bright and your heart full of hope. ✨',emoji:'🌷'},healthy:{title:'Stay healthy',text:'Take care of yourself, stay healthy, and keep shining every day. 💚',emoji:'🍃'},positivity:{title:'Enjoy your day with positivity',text:'Enjoy every moment and let positivity brighten your whole day. 🌼',emoji:'☀️'},day:{title:'Have a Good Day',text:'May your day bloom with happiness, kind moments, and lovely surprises. ✨',emoji:'🌼'}};
function closeWish(){message.classList.remove('show');clearTimeout(closeTimer)}function showWish(type){const w=wishes[type]||wishes.day;title.textContent=w.title;body.textContent=w.text;emoji.textContent=w.emoji;message.classList.add('show');clearTimeout(closeTimer);closeTimer=setTimeout(closeWish,8000)}
document.querySelectorAll('.blossom').forEach(el=>{el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation()})});document.querySelectorAll('.leaf[data-message]').forEach(el=>{el.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();showWish(el.dataset.message)});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();showWish(el.dataset.message)}})});message.addEventListener('click',closeWish);document.getElementById('closeMessage').addEventListener('click',e=>{e.stopPropagation();closeWish()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeWish()});
</script></body></html>
